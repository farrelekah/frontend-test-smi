<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Test - Product App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="login-section" class="container form-container">
        <h2>Login Aplikasi</h2>
        <p>Silakan masukkan email dan password sembarang untuk simulasi.</p>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="user@mail.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="123456">
            </div>
            <p id="login-error" class="error-text"></p>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <!-- HALAMAN DASHBOARD (Disembunyikan di awal) -->
    <div id="dashboard-section" class="container hidden">
        <div class="header">
            <h2>Daftar Produk DummyJSON</h2>
            <button id="logout-btn" class="btn btn-outline">Logout</button>
        </div>
        
        <div id="loading-state" class="state-text">Sedang memuat data...</div>
        <div id="error-state" class="state-text hidden error-text">Gagal mengambil data dari API.</div>
        <div id="empty-state" class="state-text hidden">Tidak ada produk yang ditemukan.</div>
        
        <div id="product-grid" class="grid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
